<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Pegue e Monte</title>
<meta name="theme-color" content="#2A1B3D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pegue e Monte">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="estilo.css?v=20261118b">
<style>
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  #faixa { position: sticky; top: 0; z-index: 40; }
  .topo { position: sticky; top: var(--altura-faixa, 0px); z-index: 20; background: var(--fundo); padding: calc(14px + env(safe-area-inset-top)) 18px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .topo .marca { display: flex; align-items: center; gap: 10px; min-width: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; }
  .topo .marca svg { flex: 0 0 auto; }
  .marca-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { max-width: 640px; margin: 0 auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 16px; }
  nav.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--linha); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom); }
  nav.abas button { border: 0; background: none; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; font-weight: 800; color: var(--texto2); cursor: pointer; }
  nav.abas button.ativa { color: var(--destaque); }
  nav.abas button { position: relative; }
  .contador { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--destaque); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .secao-titulo { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .item-res { display: flex; align-items: center; gap: 12px; }
  .item-res .info { flex: 1; min-width: 0; }
  .item-res .nome { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vazio-txt { color: var(--texto2); font-weight: 600; padding: 6px 2px; }
  .kits-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kit-card { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .kit-card .nome { font-weight: 800; line-height: 1.2; }
  .entrada { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 18px; }
  .entrada .caixa { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
  .logo-app { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  .bandeirinhas { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto -4px; }
  .fin { display: flex; flex-direction: column; gap: 12px; }
  .fin-mes { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; }
  .fin-destaque { background: var(--tinta); color: #fff; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
  .fin-rotulo { font-size: 14px; font-weight: 700; color: #D9CFE6; }
  .fin-valor { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1; }
  .fin-sub { font-size: 14px; font-weight: 800; color: #9FE3BD; }
  .fin-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fin-cartao { background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .fin-cartao b { font-size: 16px; }
  .clicavel-fin { cursor: pointer; font: inherit; color: inherit; box-shadow: inset 0 0 0 2px var(--lilas); }
  .titulo-alerta { display: flex; align-items: center; gap: 8px; }
  .titulo-alerta::before { content: ''; width: 12px; height: 12px; border-radius: 99px; background: var(--cor); flex: 0 0 auto; }
  .num-alerta { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
  .resumo-num { font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; }

/* Versão para computador (telas largas). No celular nada muda. */
@media (min-width: 1024px) {
  body { padding-bottom: 0; padding-left: 248px; }
  nav.abas { top: 0; bottom: 0; right: auto; width: 248px; display: flex; flex-direction: column; gap: 4px; padding: 96px 14px 20px; border-top: 0; border-right: 1px solid var(--linha); }
  nav.abas::before { content: ''; position: absolute; left: 22px; top: 26px; width: 40px; height: 40px; background: url(icone.svg) center/contain no-repeat; }
  nav.abas::after { content: 'Pegue e Monte'; position: absolute; left: 72px; top: 32px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; color: var(--tinta); }
  nav.abas button { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 14px; font-size: 16px; }
  nav.abas button:hover { background: var(--lilas); }
  nav.abas button.ativa { background: #FCE9EB; }
  nav.abas .contador { position: static; margin-left: auto; border: 0; }
  .topo { padding: 18px 32px 12px; border-bottom: 1px solid var(--linha); }
  .topo .marca svg, .topo .marca img { display: none; }
  .topo .marca { font-size: 22px; }
  main { max-width: 1440px; padding: 24px 40px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 24px; align-items: start; }
  main > * { grid-column: 1 / -1; }
  main > .fin, main > .metade { grid-column: auto; }
  .kits-grade { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .cal button { min-height: 64px; aspect-ratio: auto; height: 76px; font-size: 17px; }
  .painel-fundo { left: 248px; background: rgba(42,27,61,.35); padding: 28px; }
  .painel { max-width: 760px; min-height: auto; border-radius: 24px; background: var(--fundo); box-shadow: 0 30px 60px rgba(42,27,61,.25); padding: 0 28px 28px; }
  .painel-barra { margin: 0 -28px; padding-left: 16px; padding-right: 28px; border-radius: 24px 24px 0 0; }
}
@media (min-width: 1024px) {
  main:has(> .fin) > .fin { grid-column: 1; grid-row: 2 / span 5; }
  main:has(> .fin) > h2, main:has(> .fin) > section.coluna:not(.primeiros) { grid-column: 2; }
  main > .primeiros { grid-column: 1 / -1; }
  main > h2 { margin-top: 0; }
  main > .primeiros { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  main > .primeiros > *:not(.passo):not([class*=passo]) { grid-column: 1 / -1; }
}
@media (min-width: 1024px) {
  main:has(.cal) { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  main:has(.cal) > .linha-flex { grid-column: 1; }
  main:has(.cal) > .cartao { grid-column: 1; }
  main:has(.cal) > section.coluna { grid-column: 2; grid-row: 1 / span 2; }
  main:has(.cal) .cal button { height: 64px; }
}
@media (min-width: 1440px) {
  .kits-grade { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
  main > .vitrine-loja { grid-column: 1 / -1; }
  main:has(> .bf-card) > section.cartao, main:has(> .instalar) > section.cartao { grid-column: auto; }
  main:has(> .instalar) > .btn.cheio { grid-column: 1; justify-self: start; width: auto; }
}
</style>
</head>
<body>
<div id="faixa"></div>
<div id="raiz"><div class="carregando">Carregando…</div></div>
<div id="painel"></div>
<div id="toast" class="toast oculto" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=20261118b"></script>
</body>
</html>
