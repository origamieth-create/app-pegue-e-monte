<style>
  body { background: #FFFBF7; }
  .ct-pag { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  .loja-ct { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .loja-ct img { width: 84px; height: 84px; border-radius: 999px; background: #fff; object-fit: contain; box-shadow: 0 4px 14px rgba(0,0,0,.1); }

    body { background: #fff; }
    .nao-imprimir { display: none !important; }
    .ct-pag { padding: 0; max-width: none; }
    .folha { box-shadow: none; padding: 0; font-size: 12.5px; }
